services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - mysql
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: behavior_management
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine

volumes:
  mysql_data:
